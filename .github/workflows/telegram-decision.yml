name: Telegram decision (button press, record only)
# Receives a button press forwarded by the Cloudflare Worker (telegram/worker) as repository_dispatch.
# Re-verifies everything (HMAC signature, owner chat, known request, not expired, single use) and records the decision
# on branch telegram-data, closes the request (no reminder) and removes its buttons. Silent mode: no extra message,
# the press is acknowledged by the Worker's toast only. It NEVER publishes, schedules or dispatches anything: per CLAUDE.md, publishing consent
# is given only in the Claude chat; a Telegram press is a recorded signal, not consent.
# Inactive until: this file is on main, secret TELEGRAM_CALLBACK_SECRET exists, and the Worker is deployed with a webhook.
on:
  repository_dispatch:
    types: [telegram_decision]
permissions:
  contents: write
concurrency:
  group: telegram-registry
  cancel-in-progress: false
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CALLBACK_SECRET: ${{ secrets.TELEGRAM_CALLBACK_SECRET }}
      DATA: ${{ github.event.client_payload.data }}
      FROM_ID: ${{ github.event.client_payload.from_id }}
    steps:
      - uses: actions/checkout@v4
        with: {path: code}
      - name: Registry branch
        run: |
          mkdir reg && cd reg && git init -q -b telegram-data
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin telegram-data && git checkout -q -f FETCH_HEAD -B telegram-data
      - name: Verify and record
        id: rec
        run: |
          echo "::add-mask::$FROM_ID"
          set +e
          python3 code/telegram/tg.py --out ../result.json decide --data "$DATA" --from-id "$FROM_ID" --registry reg
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Commit decision
        if: steps.rec.outputs.rc == '0'
        run: |
          cd reg
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "telegram decision ${GITHUB_RUN_ID}"
          for i in 1 2 3; do git push -q origin HEAD:telegram-data && exit 0; git pull -q --rebase origin telegram-data; sleep 3; done
          exit 1
