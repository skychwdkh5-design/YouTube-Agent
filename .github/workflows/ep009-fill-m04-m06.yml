name: EP009 acquire missing ASTER USGS source images
on:
  pull_request:
    paths:
      - '.github/workflows/ep009-fill-m04-m06.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/ep009-tornado-scars
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.1.0
      - name: Download NASA ASTER and two USGS originals; validate and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, os, pathlib, time, urllib.request
          from PIL import Image
          out=pathlib.Path("productions/ep009-tornado-scars/media_original")
          out.mkdir(parents=True,exist_ok=True)
          entries=[
            dict(id="M04",name="nasa_aster_birmingham_20110504.jpg",
              url="https://assets.science.nasa.gov/dynamicimage/assets/science/esd/eo/images/imagerecords/50000/50462/concord_ast_2011124_lrg.jpg?w=4096",
              source="https://science.nasa.gov/earth/earth-observatory/tornado-damage-near-birmingham-alabama-50462/",
              attribution="NASA Earth Observatory / Jesse Allen; data NASA/GSFC/METI/ERSDAC/JAROS and US/Japan ASTER Science Team",
              minwidth=1200),
            dict(id="M05",name="usgs_landsat_tuscaloosa_tornado_scar.png",
              url="https://d9-wret.s3.us-west-2.amazonaws.com/assets/palladium/production/s3fs-public/media/images/Tornado%20scar%20Ala.png",
              source="https://www.usgs.gov/media/images/tuscaloosa-birmingham-tornado-scar-april-2011",
              attribution="USGS / Public Domain",minwidth=800),
            dict(id="M06",name="usgs_lcmap_landcover_change_2011.jpg",
              url="https://d9-wret.s3.us-west-2.amazonaws.com/assets/palladium/production/s3fs-public/thumbnails/image/Hult_LCChange.jpg",
              source="https://www.usgs.gov/media/images/lcmap-landcover-change-2011-tornadoes",
              attribution="USGS LCMAP / Public Domain",minwidth=800),
          ]
          manifest=[]
          for item in entries:
            last=None
            for attempt in range(3):
              try:
                req=urllib.request.Request(item["url"],headers={"User-Agent":"OrbitalAtlasSourceArchive/1.0","Accept":"image/jpeg,image/png,*/*"})
                with urllib.request.urlopen(req,timeout=45) as response:
                  data=response.read(40*1024*1024)
                if len(data)<10000 or len(data)>35*1024*1024:
                  raise ValueError(f"Unexpected byte count {len(data)}")
                with Image.open(io.BytesIO(data)) as im:
                  im.verify()
                with Image.open(io.BytesIO(data)) as im:
                  w,h=im.size; form=im.format
                if w<item["minwidth"] or h<300: raise ValueError(f"Insufficient resolution {w}x{h}")
                path=out/item["name"];path.write_bytes(data)
                manifest.append(dict(id=item["id"],path=str(path),url=item["url"],source=item["source"],
                  attribution=item["attribution"],width=w,height=h,format=form,bytes=len(data),
                  sha256=hashlib.sha256(data).hexdigest(),status="FORMAT_VERIFIED_EDITORIAL_QC_PENDING"))
                print(item["id"],w,h,len(data),flush=True)
                last=None
                break
              except Exception as e:
                last=e
                time.sleep(2*(attempt+1))
            if last:raise RuntimeError(f"{item['id']} failed: {last}")
          (out/"m04_m06_manifest.json").write_text(json.dumps({"assets":manifest},indent=2))
          assert len(manifest)==3
          PY
      - name: Commit only exact checked source images to EP009 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- \
            productions/ep009-tornado-scars/media_original/nasa_aster_birmingham_20110504.jpg \
            productions/ep009-tornado-scars/media_original/usgs_landsat_tuscaloosa_tornado_scar.png \
            productions/ep009-tornado-scars/media_original/usgs_lcmap_landcover_change_2011.jpg \
            productions/ep009-tornado-scars/media_original/m04_m06_manifest.json
          if git diff --cached --quiet; then
            echo "Sources already committed"
          else
            git commit -m "EP009: add NASA ASTER and USGS Landsat LCMAP originals"
            git push origin HEAD:production/ep009-tornado-scars
          fi
