name: YouTube schedule — Такое бывает
# Scheduled publishing for the second channel UCOakEPBhSGwx-2RV0dKGdNA (ANIMAVERSE series).
# Modes: dry_run (checks + slot plan, sends nothing) | private_test (one private upload, no publishAt) |
# schedule (private + publishAt, every 2 h on the Nha Trang grid; the private test video gets publishAt, no re-upload).
# Persistent journal: branch takoe-data, takoe/journal.jsonl (id, sha256, videoId, publishAt). Orbital Atlas / NEXORA queues are not touched.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry_run | private_test | schedule
        required: true
        default: dry_run
        type: choice
        options: [dry_run, private_test, schedule]
      media_ref:
        description: ANIMAVERSE release tag or branch with youtube/takoe/youtube-queue.json and media
        required: true
        default: media/youtube-takoe-2026-11-27
        type: string
      test_id:
        description: queue id for private_test
        default: LESO-S01E01
        type: string
      ids:
        description: optional comma-separated queue ids (default all)
        default: ""
        type: string
permissions:
  contents: write
concurrency:
  group: youtube-takoe-private-queue
  cancel-in-progress: false
jobs:
  takoe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Journal branch
        run: |
          git fetch --depth 1 origin takoe-data
          git worktree add "$RUNNER_TEMP/takoe-data" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/takoe-data/takoe"
          touch "$RUNNER_TEMP/takoe-data/takoe/journal.jsonl"
      - name: Fetch queue and media from ANIMAVERSE (private)
        env:
          GH_TOKEN: ${{ secrets.ANIMAVERSE_RELEASE_READ_TOKEN }}
          MEDIA_REF: ${{ inputs.media_ref }}
        run: |
          set -euo pipefail
          [[ "$MEDIA_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad media_ref"; exit 1; }
          M="$RUNNER_TEMP/takoe-media"; mkdir -p "$M"
          for u in repos/skychwdkh5-design/ANIMAVERSE repos/skychwdkh5-design/ANIMAVERSE/releases "repos/skychwdkh5-design/ANIMAVERSE/contents/README.md" "repos/skychwdkh5-design/ANIMAVERSE/branches/main"; do
            echo "access check $u: $(gh api "$u" --silent 2>&1 && echo ok || true)"
          done
          if gh release view "$MEDIA_REF" --repo skychwdkh5-design/ANIMAVERSE >/dev/null 2>&1; then
            gh release download "$MEDIA_REF" --repo skychwdkh5-design/ANIMAVERSE --dir "$M" --pattern '*.mp4' --pattern youtube-queue.json
          else
            # git over HTTPS is refused for this read token; the contents API works with the same permission
            A="repos/skychwdkh5-design/ANIMAVERSE/contents/youtube/takoe"
            gh api -H "Accept: application/vnd.github.raw" "$A/youtube-queue.json?ref=$MEDIA_REF" > "$M/youtube-queue.json"
            for f in $(gh api "$A/media?ref=$MEDIA_REF" --jq '.[] | select(.type=="file" and (.name|test("^[A-Za-z0-9._-]+[.]mp4$"))) | .name'); do
              gh api -H "Accept: application/vnd.github.raw" "$A/media/$f?ref=$MEDIA_REF" > "$M/$f"
            done
          fi
          ls -l "$M" | awk '{print $5, $9}'
      - name: Tests
        run: python3 -m unittest discover -s .claude/skills/yt-publish -p "test_takoe_schedule.py"
      - name: Verify channel (read-only)
        env:
          YT_CLIENT_ID: ${{ secrets.ANIMAVERSE_YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.ANIMAVERSE_YT_CLIENT_SECRET }}
          ANIMAVERSE_YT_REFRESH_TOKEN: ${{ secrets.ANIMAVERSE_YT_REFRESH_TOKEN }}
        run: python3 .claude/skills/yt-publish/second_channel.py check
      - name: Run ${{ inputs.mode }}
        env:
          YT_CLIENT_ID: ${{ secrets.ANIMAVERSE_YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.ANIMAVERSE_YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.ANIMAVERSE_YT_REFRESH_TOKEN }}
          ANIMAVERSE_YT_REFRESH_TOKEN: ${{ secrets.ANIMAVERSE_YT_REFRESH_TOKEN }}
          MODE: ${{ inputs.mode }}
          TEST_ID: ${{ inputs.test_id }}
          IDS: ${{ inputs.ids }}
        run: |
          set -o pipefail
          S=.claude/skills/yt-publish/takoe_schedule.py
          args=(--queue "$RUNNER_TEMP/takoe-media/youtube-queue.json" --media-dir "$RUNNER_TEMP/takoe-media" --journal "$RUNNER_TEMP/takoe-data/takoe/journal.jsonl")
          if [[ -n "$IDS" ]]; then args+=(--ids "$IDS"); fi
          case "$MODE" in
            dry_run) python3 "$S" plan "${args[@]}" ;;
            private_test) python3 "$S" private-test "${args[@]}" --id "$TEST_ID" --confirm ;;
            schedule) python3 "$S" schedule "${args[@]}" --confirm ;;
          esac | tee "$RUNNER_TEMP/takoe-result.json"
      - name: Save journal
        if: always()
        run: |
          cd "$RUNNER_TEMP/takoe-data"
          git add takoe/journal.jsonl
          if git diff --cached --quiet; then echo "journal unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "takoe journal: ${{ inputs.mode }} run ${{ github.run_id }}"
          for i in 1 2 3; do git push origin HEAD:takoe-data && exit 0; sleep 5; git pull -q --rebase origin takoe-data; done
          exit 1
      - name: Result
        if: always()
        run: cat "$RUNNER_TEMP/takoe-result.json" 2>/dev/null || true
