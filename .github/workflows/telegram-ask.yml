name: Telegram ask (from a Claude session, silent mode gate)
# A Claude session asks for the owner's decision by pushing requests/ask-<name>.json to branch telegram-ops.
# Same gate as telegram-notify.yml: anything that does not need the owner is suppressed and never sent.
# requests/resolve-<name>.json = {"op": "resolve", "dedup_key": K} closes an open request (no reminder).
# Result (sanitized: sent / suppressed / duplicate, no chat id) -> results/<file> on telegram-ops.
on:
  push:
    branches: [telegram-ops]
    paths: ['requests/ask-*.json', 'requests/resolve-*.json']
permissions:
  contents: write
concurrency:
  group: telegram-registry
  cancel-in-progress: false
jobs:
  ask:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CALLBACK_SECRET: ${{ secrets.TELEGRAM_CALLBACK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s telegram -q
      - name: "Gate and deliver new asks, close resolved ones (registry on branch telegram-data)"
        run: |
          mkdir -p results
          for r in requests/ask-*.json requests/resolve-*.json; do
            [ -f "$r" ] || continue
            n=$(basename "$r"); [ -f "results/$n" ] && continue
            python3 telegram/ci_ask.py from-file "$r" > "results/$n" || true
            cat "results/$n"
          done
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git diff --cached --quiet && exit 0
          git commit -q -m "telegram ask results ${GITHUB_RUN_ID}"
          for i in 1 2 3; do git push -q origin HEAD:telegram-ops && exit 0; git pull -q --rebase origin telegram-ops; sleep 3; done
