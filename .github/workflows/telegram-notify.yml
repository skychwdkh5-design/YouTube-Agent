name: Telegram request (silent mode gate)
# APPROVAL ONLY / SILENT MODE (owner policy 2026-11-21, docs/TELEGRAM_NOTIFICATIONS.md).
# The ONLY way any workflow may contact the owner in Telegram. It sends nothing unless kind is
# APPROVAL_REQUIRED | PERMISSION_REQUIRED | HUMAN_INTERVENTION_REQUIRED and every mandatory field is filled;
# everything else is logged as "suppressed". One open dedup_key = one notification; delivery failures stay queued
# for telegram-sweep.yml. Button presses are recorded only and never start publishing.
# Callable from other repos too (Orbital Atlas, NEXORA, ANIMAVERSE):
#   uses: skychwdkh5-design/YouTube-Agent/.github/workflows/telegram-notify.yml@main   (+ the three secrets)
# The registry lives on branch telegram-data of the CALLING repository.
on:
  workflow_call:
    inputs:
      kind: {type: string, required: true}
      project: {type: string, required: true}
      need: {type: string, required: true}
      why_blocked: {type: string, required: true}
      on_approve: {type: string, required: true}
      on_reject: {type: string, required: true}
      dedup_key: {type: string, required: true}
      recovery_attempted: {type: string, required: false, default: ""}
      link: {type: string, required: false, default: ""}
      button_safe: {type: boolean, required: false, default: false}
      auto_resolvable: {type: boolean, required: false, default: false}
      ttl_hours: {type: number, required: false, default: 168}
    secrets:
      TELEGRAM_BOT_TOKEN: {required: false}   # never block the caller; a missing secret just queues
      TELEGRAM_CHAT_ID: {required: false}
      TELEGRAM_CALLBACK_SECRET: {required: false}
permissions:
  contents: write
concurrency:
  group: telegram-registry
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CALLBACK_SECRET: ${{ secrets.TELEGRAM_CALLBACK_SECRET }}
      IN: ${{ toJSON(inputs) }}
    steps:
      - name: Telegram Control code (always from YouTube-Agent main)
        uses: actions/checkout@v4
        with: {repository: skychwdkh5-design/YouTube-Agent, ref: main, path: code}
      - name: Registry branch telegram-data (calling repo)
        run: |
          mkdir reg && cd reg && git init -q -b telegram-data
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin telegram-data; then git checkout -q -f FETCH_HEAD -B telegram-data; fi
      - name: Gate and deliver (suppressed events are only logged)
        run: |
          python3 - <<'PY'
          import json, os
          i = json.loads(os.environ["IN"])
          n = {k: i[k] for k in ("kind","project","need","why_blocked","on_approve","on_reject","dedup_key",
                                 "recovery_attempted","link","button_safe","auto_resolvable")}
          n["ttl_seconds"] = int(float(i.get("ttl_hours") or 168) * 3600)
          json.dump(n, open("req.json", "w"), ensure_ascii=False)
          PY
          python3 code/telegram/tg.py request --json req.json --registry reg
      - name: Save registry (also after failures, so nothing is lost)
        if: always()
        run: |
          cd reg; [ -n "$(git status --porcelain)" ] || exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "telegram request ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do git push -q origin HEAD:telegram-data && exit 0; git pull -q --rebase origin telegram-data || true; sleep $((i*3)); done
          exit 1
