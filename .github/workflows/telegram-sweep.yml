name: Telegram sweep (retry, single reminder, expiry)
# Every 10 min: re-deliver queued requests, send the ONE reminder 30+ min after delivery if still undecided,
# close expired requests as "expired" (never as approved). If a request is still undelivered after 6 h, opens one
# GitHub issue as a fallback channel. Silent when there is nothing open. Never decides, publishes or dispatches.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: telegram-registry
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CALLBACK_SECRET: ${{ secrets.TELEGRAM_CALLBACK_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {path: code}
      - name: Sweep (retries, one reminder, expiry, 6 h fallback issue)
        run: python3 code/telegram/ci_ask.py sweep --fallback-issue
