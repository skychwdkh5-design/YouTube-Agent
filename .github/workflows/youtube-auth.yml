name: YouTube auth (one-time)  # also: owner-requested reschedule of a scheduled video
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "device = old device-flow login (no captions); url = make the browser consent link (artifact); code = exchange the code from the redirected address"
        type: choice
        options: [device, url, code, reschedule, captions]
        default: device
      code:
        description: "mode=code only: the one-time code, or the whole http://127.0.0.1:8765/?code=... address"
        required: false
      video_id:
        description: "mode=reschedule/captions: id of an already scheduled (private + publishAt) video"
        required: false
      caption_path:
        description: "mode=captions only: SRT path on branch publish-data, e.g. publish/assets/ep013/captions.srt"
        required: false
      publish_at:
        description: "mode=reschedule only: new time, RFC 3339 UTC, e.g. 2026-11-13T01:00:00Z (>= 30 min ahead)"
        required: false
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install pynacl
      - name: Mask the one-time code
        if: ${{ inputs.mode == 'code' }}
        env:
          C: ${{ inputs.code }}
        run: echo "::add-mask::$C"
      - name: Device-flow login (open the code shown in this log at google.com/device)
        if: ${{ inputs.mode == 'device' || inputs.mode == '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python3 .claude/skills/yt-publish/publish.py auth
      - name: Browser login link (with captions permission)
        if: ${{ inputs.mode == 'url' }}
        env:
          YT_DESKTOP_CLIENT_ID: ${{ secrets.YT_DESKTOP_CLIENT_ID }}
        run: |
          python3 .claude/skills/yt-publish/publish.py auth-url --out consent_url.txt
          # the OAuth client id is public (it appears in every consent link) but stored as a secret, so the plain log masks it
          echo "consent link (base64): $(base64 -w0 consent_url.txt)"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'url' }}
        with:
          name: consent-url
          path: consent_url.txt
          retention-days: 1
      - name: Exchange the code and store YT_REFRESH_TOKEN
        if: ${{ inputs.mode == 'code' }}
        env:
          YT_DESKTOP_CLIENT_ID: ${{ secrets.YT_DESKTOP_CLIENT_ID }}
          YT_DESKTOP_CLIENT_SECRET: ${{ secrets.YT_DESKTOP_CLIENT_SECRET }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          YT_AUTH_CODE: ${{ inputs.code }}
        run: python3 .claude/skills/yt-publish/publish.py auth-code
      - name: Reschedule a scheduled video (owner request; stays private until publishAt)
        if: ${{ inputs.mode == 'reschedule' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_ID: ${{ inputs.video_id }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: python3 .claude/skills/yt-publish/publish.py reschedule --video-id "$VIDEO_ID" --publish-at "$PUBLISH_AT" --confirm
      - name: Add a caption track to an existing video (owner request)
        if: ${{ inputs.mode == 'captions' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_ID: ${{ inputs.video_id }}
          CAP: ${{ inputs.caption_path }}
        run: |
          git fetch -q --depth=1 origin publish-data
          git show "origin/publish-data:$CAP" > /tmp/cap.srt
          python3 .claude/skills/yt-publish/publish.py captions-add --video-id "$VIDEO_ID" --file /tmp/cap.srt --confirm
